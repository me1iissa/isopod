name: Coverage

# Advisory line coverage on pushes to main: a summary table on the run page
# and an lcov artifact for local drill-down. No hosted service, no token, no
# threshold, no gate — `continue-on-error` below means a failure here never
# reddens a build, and nothing may ever be made to depend on this number.
#
# The number systematically undercounts, and gating on it would punish the
# wrong code: the `#[ignore]`d suite — real boots, the jail, VM lifecycle, the
# egress-enforcement ledger — does not run here, so the best-defended paths in
# the tree are absent from every percentage this workflow prints.
#
# Not because a hosted runner cannot boot a microVM. It can: the full-boot
# probe granted itself kvm-group access through a udev rule and measured a
# guest booting in 84 ms. The reason is cost. Reaching that point takes a
# vendored Firecracker build, four guest images and a privileged `isopod
# setup` — some twenty minutes — which is why it lives in a dispatch-only
# probe rather than on every push.
#
# What the report is for: finding the module or branch that NO test executes —
# the one question the mutation harness does not ask, because it only
# interrogates code it has a mutation for.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded coverage run is worthless; cancel it.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    # Advisory means advisory: a red coverage job must not mark the push red.
    continue-on-error: true
    permissions:
      contents: write # force-pushes the badge endpoint to the orphan `badges` branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-llvm-cov
      # Caching here is fine, unlike in release.yml: nothing this job produces
      # is shipped, signed, or attested — a poisoned cache can only corrupt a
      # number that gates nothing.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only \
            | tee /tmp/coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --lcov --output-path lcov.info

      # The same parser the pull-request digest uses, so the badge and the
      # comment can never disagree about what the number is. It writes nothing
      # when the summary did not parse, which leaves the previous badge standing
      # rather than replacing a real number with a wrong one.
      - name: Render the badge endpoint
        id: badge
        run: |
          python3 .github/ci-digest.py \
            --head-lock Cargo.lock --base-lock Cargo.lock \
            --coverage /tmp/coverage.txt --code-changed true \
            --badge-out /tmp/coverage.json > /dev/null
          if [ -f /tmp/coverage.json ]; then
            cat /tmp/coverage.json
            echo "rendered=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::coverage summary did not parse; badge left unchanged"
            echo "rendered=false" >> "$GITHUB_OUTPUT"
          fi

      # The endpoint document lives on an orphan `badges` branch that shields.io
      # reads and nothing else does, so a number that changes on every push
      # never enters main's history. The branch ruleset protects main only.
      # Force-push is correct here: the branch carries state, not history.
      - name: Publish the badge
        if: steps.badge.outputs.rendered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          work="$(mktemp -d)"
          cd "$work"
          git init -q
          git checkout -q --orphan badges
          cp /tmp/coverage.json .
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "coverage badge: $(jq -r .message coverage.json)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges
          echo "published $(jq -r .message coverage.json) to the badges branch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
