name: Docs site

# The site is rendered from the repository's own Markdown by
# scripts/build-docs-site.py — the docs stay readable in the repo and are never
# rewritten to suit the site. Deploys on a push that touches any source the site
# renders, so a docs-only change ships without a release.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-docs-site.py"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "BENCHMARKS.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "PLAN.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Deploy permissions live on the deploy job, not here: the build job runs the
# renderer over repository content and has no business holding pages: write or
# an OIDC token while it does.
permissions:
  contents: read

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install renderer
        run: pip install --quiet markdown==3.5.2 pygments==2.17.2

      # --check fails the build if any in-repo Markdown link has no rendered
      # destination, so a renamed doc breaks here rather than shipping a 404.
      - name: Build
        run: python3 scripts/build-docs-site.py --out _site --check

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publishes the rendered artifact to the Pages origin
      id-token: write # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
