name: Full boot probe

# isopod's live suite, on a GitHub-hosted runner — and the probe that earned it
# the right to run there.
#
# It started as a question. A hosted runner had to be shown to give us /dev/kvm,
# then to let something open it, then to build a vendored Firecracker and four
# guest images, then to survive the one privileged step (`isopod setup`, which
# creates taps in the root netns and installs an nftables table), and finally to
# actually move packets. Run 30542332477 closed the last of it on a free
# ubuntu-latest: a guest booted in 84 ms, reached a literal IP over TLS with no
# DNS anywhere in the path, resolved names — and, the part that matters, had an
# allowlisted host allowed with byte counts recorded and a non-allowlisted one
# refused with `reason: "not_allowed"`. Policy, not a timeout dressed up as one.
#
# It took four attempts to get an honest answer, and every failure was a control
# that could not fail: an egress step that printed `denied-ok` when BOTH requests
# failed; a NAT step that exited 0 on a trailing `echo`; a DNS diagnosis that was
# confidently wrong until a literal-IP test with no resolver involved failed too
# (the real cause was Docker's FORWARD policy DROP — finding #51). Hence the
# structure below: the assertions carry `continue-on-error` and a gate at the end
# enforces them together, so a red step can never skip the diagnostics that
# explain it, and every check is one that has been seen to produce BOTH answers.
#
# So the suite now runs nightly rather than nowhere but a maintainer's laptop.
# Nightly and not per-PR: twenty minutes of Firecracker and image builds does not
# belong on the pull-request path, and on a one-maintainer project a regression
# caught by morning is caught early enough.
on:
  schedule:
    # 04:17 UTC — off the hour, because everyone's cron is on the hour and
    # GitHub's shared scheduler drifts most when it is busiest.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      run_live_suite:
        description: "Also run the #[ignore]d live tests if the boot succeeds"
        type: boolean
        default: false

permissions: {}

# Twenty-minute runs must not stack up. A superseded probe is worthless, but
# never cancel one that is already establishing something.
concurrency:
  group: full-boot-probe
  cancel-in-progress: false

jobs:
  boot:
    name: Boot a real microVM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive # vendor/firecracker is built from source below
          persist-credentials: false

      - name: Runner shape
        run: |
          echo "vCPU:   $(nproc)"
          echo "memory: $(free -g | awk '/Mem:/{print $2}') GiB"
          echo "disk:   $(df -h / | awk 'NR==2{print $4}') free"
          echo "kernel: $(uname -r)"

      # Established by the KVM probe: the device is root:kvm 0660 and the runner
      # user is not in the group, so this rule is the difference between present
      # and usable. GitHub's own Android-virtualisation docs prescribe it.
      - name: Grant kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          # musl-tools: the guest agent is a static-pie musl binary.
          # busybox-static: build-rootfs copies the host's static busybox in.
          # nftables: `isopod setup` installs the egress ruleset through it.
          # dnsutils: the egress diagnostics below query resolvers directly, to
          # tell "this network blocks public DNS" from "our NAT is broken".
          sudo apt-get install -y -qq musl-tools busybox-static nftables dnsutils
          echo "busybox: $(command -v busybox) $(file -b "$(command -v busybox)" | cut -c1-40)"
          echo "nft:     $(nft --version)"

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl

      - name: Build isopod
        run: |
          cargo build --release --workspace --locked
          cargo build --release --locked --target x86_64-unknown-linux-musl -p isopod-guest-agent
          ./target/release/isopod --version

      # The slow step: Firecracker is built from the vendored submodule rather
      # than downloaded, which is why this probe is dispatch-only.
      - name: Build vendored Firecracker
        run: |
          ./target/release/isopod dev build-fc
          ls -l "$HOME/.isopod/bin/firecracker"

      - name: Guest images
        run: |
          ./target/release/isopod image fetch-kernel
          ./target/release/isopod image build-all
          ./target/release/isopod image ls

      # THE UNPRIVILEGED HALF. If this succeeds and the next step does not, the
      # answer is "hosted runners can boot guests but not network them", which
      # is still worth knowing: most of the live suite would run.
      - name: Boot with no network
        run: |
          ./target/release/isopod run --no-network -- \
            /bin/sh -c 'echo booted; ip addr show lo | head -1; uname -a'

      - name: Boot latency
        run: ./target/release/isopod dev boot || echo "::warning::dev boot reported a problem"

      # THE PRIVILEGED HALF, and the real unknown. `setup` creates tap devices in
      # the root netns and installs an nftables table. A hosted runner has
      # passwordless sudo, but nothing guarantees it permits tap creation or that
      # nftables is usable in whatever container-ish environment the job runs in.
      - name: Provision networking
        id: setup
        run: |
          sudo ./target/release/isopod setup
          ip -o link show | grep isopod-tap | head -3 || echo "::warning::no isopod-tap devices found"
          sudo nft list tables || echo "::warning::nft list tables failed"

      # A hypothesis with nothing to do with DNS, and it has to be ruled out
      # before any of the DNS evidence below means anything. Docker runs on
      # hosted runners and sets the `ip filter` FORWARD chain policy to DROP.
      # isopod's forward chain is a separate base chain at the same hook
      # (net/setup.rs, `policy accept`) and cannot override another base
      # chain's drop. If that is what is happening, every guest→WAN packet
      # dies regardless of resolver — which produces exactly the observed
      # EAI_AGAIN, because the host resolves through OUTPUT and the guest
      # through FORWARD. DOCKER-USER is the chain Docker provides for exactly
      # this coexistence problem.
      # The jail's whole isolation model is an unprivileged user namespace, and
      # Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1, which
      # refuses one to an unconfined process. Recorded BEFORE anything relaxes
      # it, so a future reader can tell "the runner forbade it" from "our jail
      # broke" — the first live-suite run in CI failed here and the two were
      # indistinguishable from the exit code alone.
      - name: User-namespace policy
        run: |
          for k in kernel/apparmor_restrict_unprivileged_userns user/max_user_namespaces \
                   kernel/unprivileged_userns_clone; do
            printf '%-46s %s\n' "$k" "$(cat "/proc/sys/$k" 2>/dev/null || echo '(absent)')"
          done
          if unshare --user --map-root-user true 2>/dev/null; then
            echo "unshare(CLONE_NEWUSER): permitted"
          else
            echo "unshare(CLONE_NEWUSER): REFUSED — the jail suite cannot pass as-is"
          fi

      - name: Packet-filter shape
        run: |
          echo "--- iptables FORWARD policy ---"
          sudo iptables -L FORWARD -n | head -3 || echo "(iptables unavailable)"
          echo "--- DOCKER-USER chain ---"
          sudo iptables -L DOCKER-USER -n 2>/dev/null | head -5 || echo "(no DOCKER-USER chain)"

      # busybox wget cannot be used to test egress. It issues absolute-form
      # requests for https:// URLs instead of CONNECT, so the broker refuses it
      # as malformed before policy is ever consulted — and a DNS failure reads
      # identically to a blocked host. The first run of this probe passed both
      # egress steps that way, proving nothing. Use the alpine base and python,
      # which speaks CONNECT and distinguishes the failure modes.
      #
      # Run 30528308922 then died at getaddrinfo with EAI_AGAIN, and so proved
      # nothing about NAT either: name resolution failed before a single packet
      # was sent anywhere. DNS and packet forwarding are different failures and
      # the first masks the second, so they are measured separately here. Only
      # the by-literal-IP step and the filtered-egress step assert; the rest
      # record facts, because a fact this probe exists to gather must not be
      # able to fail the job that gathers it.
      - name: DNS facts, host side
        run: |
          echo "--- /etc/resolv.conf ---"
          cat /etc/resolv.conf || true
          echo "--- /run/systemd/resolve/resolv.conf ---"
          cat /run/systemd/resolve/resolv.conf 2>/dev/null || echo "(absent)"
          echo "--- can the HOST reach the resolvers isopod bakes into guests? ---"
          for r in 1.1.1.1 8.8.8.8; do
            ans="$(dig +time=3 +tries=1 +short "@$r" example.com 2>/dev/null || true)"
            if [ -n "$ans" ]; then
              echo "host -> $r:53   ANSWERED ($ans)"
            else
              echo "host -> $r:53   NO ANSWER — this network does not permit the resolvers isopod hardcodes"
            fi
          done

      # THE DECISIVE STEP, and run 30533962633 answered it: this FAILS on a
      # hosted runner, and the DNS story was a red herring. The same run showed
      # `FORWARD (policy DROP)` with DOCKER-USER returning straight through to
      # it, and showed the host reaching BOTH 1.1.1.1 and 8.8.8.8 successfully.
      # So the network never blocked the resolvers isopod bakes in; Docker's
      # FORWARD policy was dropping every guest→WAN packet, the DNS query
      # among them. The fix belongs in `isopod setup`, not in the resolver.
      #
      # continue-on-error, with the gate at the end of the job: this is an
      # assertion and must redden the run, but not before the diagnostics after
      # it have been collected. In the previous run it aborted the job and
      # skipped the four steps whose output was the entire point of dispatching.
      - name: NAT forwards packets, with no DNS in the guest
        id: nat
        continue-on-error: true
        run: |
          set -o pipefail
          IP="$(getent ahostsv4 example.com | awk 'NR==1{print $1}')"
          test -n "$IP" || { echo "::error::the RUNNER ITSELF could not resolve example.com"; exit 1; }
          echo "host resolved example.com -> $IP"
          ./target/release/isopod run --stage base --base base-alpine --env "TARGET_IP=$IP" -- \
            /bin/sh -c 'python3 - <<PY
          import os, socket, ssl
          ip = os.environ["TARGET_IP"]
          ctx = ssl.create_default_context()
          with socket.create_connection((ip, 443), timeout=20) as raw:
              with ctx.wrap_socket(raw, server_hostname="example.com") as s:
                  s.sendall(b"GET / HTTP/1.1\r\nHost: example.com\r\nConnection: close\r\n\r\n")
                  status = s.recv(4096).split(b"\r\n")[0]
          assert b"200" in status, status
          print("nat-forwards-ok", status.decode())
          PY' | tee /dev/stderr > nat.txt
          grep -q nat-forwards-ok nat.txt \
            || { echo "::error::NAT does not forward packets here — the DNS failure was masking a second fault"; exit 1; }

      # The failing case from run 30528308922, recorded rather than asserted:
      # this is the behaviour the fix has to change, so the probe should keep
      # reporting it truthfully until it does.
      - name: Guest DNS as isopod configures it today
        id: dns_today
        continue-on-error: true
        run: |
          ./target/release/isopod run --stage base --base base-alpine -- \
            /bin/sh -c 'echo "guest resolv.conf:"; cat /etc/resolv.conf; python3 - <<PY
          import socket
          try:
              print("guest-dns-ok", socket.gethostbyname("example.com"))
          except Exception as e:
              print("guest-dns-FAILED:", type(e).__name__, e)
          PY'

      # Validates the proposed fix before any of it is written: if pointing the
      # guest at the HOST's own upstream resolver makes resolution work, then
      # host-derived DNS is the answer and the hardcoded public resolvers are
      # the whole defect.
      - name: Guest DNS via the host's own upstream resolver
        id: dns_host
        continue-on-error: true
        run: |
          UP=""
          for f in /run/systemd/resolve/resolv.conf /etc/resolv.conf; do
            [ -r "$f" ] || continue
            UP="$(awk '/^nameserver/ && $2 !~ /^127\./ { print $2; exit }' "$f")"
            [ -n "$UP" ] && break
          done
          if [ -z "$UP" ]; then
            echo "::warning::no non-loopback resolver on the host — the loopback-stub case, which host-derived DNS must also handle"
            exit 0
          fi
          echo "host upstream resolver: $UP"
          # $UP inside the single quotes is deliberate and must NOT expand on
          # the host. The value crosses into the guest through `--env UP=`, and
          # it is the guest's shell that expands it — expanding here would bake
          # the host's resolver into the command string and the step would stop
          # testing what the guest was configured with.
          # shellcheck disable=SC2016
          ./target/release/isopod run --stage base --base base-alpine --env "UP=$UP" -- \
            /bin/sh -c 'printf "nameserver %s\n" "$UP" > /etc/resolv.conf; python3 - <<PY
          import socket
          try:
              print("host-upstream-dns-ok", socket.gethostbyname("example.com"))
          except Exception as e:
              print("host-upstream-dns-FAILED:", type(e).__name__, e)
          PY'

      # Two assertions, and BOTH must hold: the allowlisted host is reachable
      # AND the other one is refused BY POLICY. Checking only the refusal is
      # worthless — everything fails when nothing works. The denial is matched
      # on the broker's own 403, so a timeout or a DNS error fails the step
      # instead of being mistaken for enforcement.
      #
      # This step proves egress POLICY and nothing whatever about DNS. An
      # earlier revision of this comment predicted it would isolate the DNS
      # defect; that was wrong, and wrong in the same shape as every other
      # mistake this file records. A filtered guest is handed proxy variables
      # (HTTP_PROXY / HTTPS_PROXY / ALL_PROXY — crates/guest-agent/src/net.rs),
      # python's urllib honours them, and getaddrinfo against the literal proxy
      # address short-circuits, so no DNS query is emitted at all. Measured on
      # a real filtered run reaching six hosts: `"dns_queries": []`. The DNS
      # half is exercised by the step AFTER this one, which is the control that
      # prediction assumed already existed.
      - name: Boot with filtered egress and a real allowlist
        id: filtered
        continue-on-error: true # asserted by the gate at the end of the job
        run: |
          set -o pipefail
          ./target/release/isopod run --stage base --base base-alpine --allow-host example.com -- \
            /bin/sh -c 'python3 - <<PY
          import urllib.request, urllib.error
          body = urllib.request.urlopen("https://example.com/", timeout=20).read()
          assert b"Example Domain" in body, body[:200]
          print("allowed-ok")
          try:
              urllib.request.urlopen("https://pypi.org/simple/", timeout=15).read()
              print("LEAK: a host outside the allowlist was reachable")
          except Exception as e:
              # The broker refuses a tunnel to a non-allowlisted host with 403.
              # Anything else — timeout, DNS, connection reset — is NOT proof of
              # enforcement and must not be reported as one.
              if "403" in str(e):
                  print("denied-by-policy-ok")
              else:
                  print("INCONCLUSIVE: refused, but not by policy:", type(e).__name__, e)
          PY' | tee /dev/stderr > out.txt
          grep -q allowed-ok out.txt || { echo "::error::allowlisted host was NOT reachable"; exit 1; }
          grep -q denied-by-policy-ok out.txt || { echo "::error::no policy denial observed"; exit 1; }
          grep -q LEAK out.txt && { echo "::error::egress leak"; exit 1; }
          echo "both halves held: allowlisted reachable, other refused by policy"

      # THE CONTROL THAT EXERCISES HOST-SIDE DNS, and the one the tree did not
      # have. `gethostbyname` ignores the proxy environment entirely, so the
      # query goes to the guest's own resolver — which in filtered mode is the
      # slot gateway — and lands on the broker's DNS responder. That is the
      # exact mechanism a NAT-mode fix would generalise, so proving it carries
      # a packet on THIS runner class is worth more than any amount of
      # reasoning about whether it should.
      #
      # The assertion is on the run's own egress record rather than on guest
      # stdout, deliberately: `dns_queries` is written host-side from what the
      # broker actually answered, so a guest cannot fabricate it. Verified
      # locally before being committed — a filtered run of exactly this shape
      # recorded `"dns_queries": ["example.com"]`.
      - name: Filtered-mode DNS reaches the host-side responder
        id: filtered_dns
        continue-on-error: true # asserted by the gate at the end of the job
        run: |
          set -o pipefail
          ./target/release/isopod run --stage base --base base-alpine --allow-host example.com -- \
            /bin/sh -c 'python3 - <<PY
          import socket
          print("resolved", socket.gethostbyname("example.com"))
          PY' | tee /dev/stderr > fdns.json
          jq -e '.egress.dns_queries | index("example.com")' fdns.json > /dev/null || {
            echo "::error::no guest DNS query reached the broker — the gateway resolver path does not carry packets here"
            jq -c '.egress' fdns.json || true
            exit 1
          }
          echo "the broker answered a guest DNS query: $(jq -c '.egress.dns_queries' fdns.json)"

      # Every assertion above runs with continue-on-error so that a failure
      # cannot skip the diagnostics that explain it — which is exactly what
      # happened in run 30533962633, where one red step discarded the four
      # findings the dispatch existed to collect. This step is where those
      # assertions are actually enforced, so the run still goes red.
      - name: Assertions held
        env:
          NAT: ${{ steps.nat.outcome }}
          FILTERED: ${{ steps.filtered.outcome }}
          FILTERED_DNS: ${{ steps.filtered_dns.outcome }}
        run: |
          failed=""
          [ "$NAT" = "success" ] || failed="$failed\n  NAT forwarding: $NAT"
          [ "$FILTERED" = "success" ] || failed="$failed\n  filtered egress: $FILTERED"
          [ "$FILTERED_DNS" = "success" ] || failed="$failed\n  filtered DNS: $FILTERED_DNS"
          if [ -n "$failed" ]; then
            # shellcheck disable=SC2059  # $failed carries the \n escapes to expand
            printf "::error::assertions did not hold:$failed\n"
            exit 1
          fi
          echo "every assertion held"

      # `inputs` is empty on a scheduled run — workflow_dispatch inputs simply do
      # not exist there — so the schedule must be named explicitly. Without the
      # second clause the nightly run would do all twenty minutes of building and
      # then quietly skip the tests it exists to run, which is precisely the
      # shape of "green and proving nothing" this file has been rewritten three
      # times to eliminate.
      #
      # --test-threads=1 because these tests claim real network slots and boot
      # real VMs; running them concurrently makes them fight over the pool.
      # Relax it only for the live suite, and only on the runner. isopod does not
      # ask users to do this: the jail is a hardening opt-in, and a host that
      # refuses unprivileged user namespaces is entitled to. But a CI run that
      # skipped the jail tests for an environment reason would be quietly
      # covering less than it appears to, so the runner is made able to run them
      # rather than the tests being excused.
      - name: Permit unprivileged user namespaces
        if: ${{ inputs.run_live_suite || github.event_name == 'schedule' }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null \
            || echo "no apparmor userns knob on this runner; nothing to relax"
          if unshare --user --map-root-user true 2>/dev/null; then
            echo "unshare(CLONE_NEWUSER): permitted"
          else
            echo "::warning::user namespaces are still refused; the jail tests will fail for an environment reason, not a code one"
          fi

      - name: Live suite
        id: live
        if: ${{ inputs.run_live_suite || github.event_name == 'schedule' }}
        run: cargo test --workspace --locked -- --ignored --test-threads=1

      # Expansions go through env, not into the script body — the same rule the
      # rest of the tree follows. Neither value is attacker-controllable, which
      # is why zizmor rates it informational; the convention is worth more than
      # the exception.
      - name: Verdict
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          NAT_OUTCOME: ${{ steps.nat.outcome }}
          DNS_TODAY: ${{ steps.dns_today.outcome }}
          DNS_HOST: ${{ steps.dns_host.outcome }}
          FILTERED_OUTCOME: ${{ steps.filtered.outcome }}
          FILTERED_DNS: ${{ steps.filtered_dns.outcome }}
          LIVE: ${{ steps.live.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Full boot probe"
            echo ""
            echo "Whether a hosted runner can run isopod's live suite."
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| networking provisioned | $SETUP_OUTCOME |"
            echo "| NAT forwards (no guest DNS) | $NAT_OUTCOME |"
            echo "| guest DNS, as shipped | $DNS_TODAY |"
            echo "| guest DNS, host upstream | $DNS_HOST |"
            echo "| filtered egress, both halves | $FILTERED_OUTCOME |"
            echo "| filtered DNS hits the broker | $FILTERED_DNS |"
            echo "| live suite (#[ignore]d) | ${LIVE:-not run} |"
            echo "| job | $JOB_STATUS |"
            echo ""
            echo "The two DNS rows are diagnostics and never fail the job — read"
            echo "their step logs for the actual resolver behaviour."
          } >> "$GITHUB_STEP_SUMMARY"
