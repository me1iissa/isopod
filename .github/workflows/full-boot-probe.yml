name: Full boot probe

# Whether a GitHub-hosted runner can boot a real isopod microVM, end to end.
#
# The KVM probe established that /dev/kvm is present and that KVM_CREATE_VM
# returns a file descriptor once the runner is in the kvm group. That is
# necessary and NOT sufficient. isopod also needs a vendored Firecracker build,
# guest images, and — for anything beyond --no-network — tap devices and an
# nftables ruleset installed by `isopod setup`, which is the one privileged
# step. None of that has been shown to work on a hosted runner.
#
# This probe answers it. It is workflow_dispatch only, deliberately: it builds
# Firecracker from the vendored submodule and is far too slow for the PR path.
# Its output decides whether the #[ignore]d live suite — the jail, VM lifecycle
# and network enforcement tests, which today run nowhere but a maintainer's
# laptop — can run in CI at all.
#
# Every step reports what it did rather than only succeeding, because a failure
# here is a finding, not a defect.
on:
  workflow_dispatch:
    inputs:
      run_live_suite:
        description: "Also run the #[ignore]d live tests if the boot succeeds"
        type: boolean
        default: false

permissions: {}

jobs:
  boot:
    name: Boot a real microVM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive # vendor/firecracker is built from source below
          persist-credentials: false

      - name: Runner shape
        run: |
          echo "vCPU:   $(nproc)"
          echo "memory: $(free -g | awk '/Mem:/{print $2}') GiB"
          echo "disk:   $(df -h / | awk 'NR==2{print $4}') free"
          echo "kernel: $(uname -r)"

      # Established by the KVM probe: the device is root:kvm 0660 and the runner
      # user is not in the group, so this rule is the difference between present
      # and usable. GitHub's own Android-virtualisation docs prescribe it.
      - name: Grant kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          # musl-tools: the guest agent is a static-pie musl binary.
          # busybox-static: build-rootfs copies the host's static busybox in.
          # nftables: `isopod setup` installs the egress ruleset through it.
          sudo apt-get install -y -qq musl-tools busybox-static nftables
          echo "busybox: $(command -v busybox) $(file -b "$(command -v busybox)" | cut -c1-40)"
          echo "nft:     $(nft --version)"

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl

      - name: Build isopod
        run: |
          cargo build --release --workspace --locked
          cargo build --release --locked --target x86_64-unknown-linux-musl -p isopod-guest-agent
          ./target/release/isopod --version

      # The slow step: Firecracker is built from the vendored submodule rather
      # than downloaded, which is why this probe is dispatch-only.
      - name: Build vendored Firecracker
        run: |
          ./target/release/isopod dev build-fc
          ls -l "$HOME/.isopod/bin/firecracker"

      - name: Guest images
        run: |
          ./target/release/isopod image fetch-kernel
          ./target/release/isopod image build-all
          ./target/release/isopod image ls

      # THE UNPRIVILEGED HALF. If this succeeds and the next step does not, the
      # answer is "hosted runners can boot guests but not network them", which
      # is still worth knowing: most of the live suite would run.
      - name: Boot with no network
        run: |
          ./target/release/isopod run --no-network -- \
            /bin/sh -c 'echo booted; ip addr show lo | head -1; uname -a'

      - name: Boot latency
        run: ./target/release/isopod dev boot || echo "::warning::dev boot reported a problem"

      # THE PRIVILEGED HALF, and the real unknown. `setup` creates tap devices in
      # the root netns and installs an nftables table. A hosted runner has
      # passwordless sudo, but nothing guarantees it permits tap creation or that
      # nftables is usable in whatever container-ish environment the job runs in.
      - name: Provision networking
        id: setup
        run: |
          sudo ./target/release/isopod setup
          ip -o link show | grep isopod-tap | head -3 || echo "::warning::no isopod-tap devices found"
          sudo nft list tables || echo "::warning::nft list tables failed"

      # busybox wget cannot be used to test egress. It issues absolute-form
      # requests for https:// URLs instead of CONNECT, so the broker refuses it
      # as malformed before policy is ever consulted — and a DNS failure reads
      # identically to a blocked host. The first run of this probe passed both
      # egress steps that way, proving nothing. Use the alpine base and python's
      # urllib, which speaks CONNECT and distinguishes the failure modes.
      - name: Boot with NAT egress
        run: |
          set -o pipefail
          ./target/release/isopod run --stage base --base base-alpine -- \
            /bin/sh -c 'python3 - <<PY
          import urllib.request, sys
          body = urllib.request.urlopen("https://example.com/", timeout=20).read()
          assert b"Example Domain" in body, body[:200]
          print("nat-egress-ok", len(body), "bytes")
          PY' | tee /dev/stderr | grep -q nat-egress-ok

      # Two assertions, and BOTH must hold: the allowlisted host is reachable
      # AND the other one is refused BY POLICY. Checking only the refusal is
      # worthless — everything fails when nothing works. The denial is matched
      # on the broker's own 403, so a timeout or a DNS error fails the step
      # instead of being mistaken for enforcement.
      - name: Boot with filtered egress and a real allowlist
        run: |
          set -o pipefail
          ./target/release/isopod run --stage base --base base-alpine --allow-host example.com -- \
            /bin/sh -c 'python3 - <<PY
          import urllib.request, urllib.error
          body = urllib.request.urlopen("https://example.com/", timeout=20).read()
          assert b"Example Domain" in body, body[:200]
          print("allowed-ok")
          try:
              urllib.request.urlopen("https://pypi.org/simple/", timeout=15).read()
              print("LEAK: a host outside the allowlist was reachable")
          except Exception as e:
              # The broker refuses a tunnel to a non-allowlisted host with 403.
              # Anything else — timeout, DNS, connection reset — is NOT proof of
              # enforcement and must not be reported as one.
              if "403" in str(e):
                  print("denied-by-policy-ok")
              else:
                  print("INCONCLUSIVE: refused, but not by policy:", type(e).__name__, e)
          PY' | tee /dev/stderr > out.txt
          grep -q allowed-ok out.txt || { echo "::error::allowlisted host was NOT reachable"; exit 1; }
          grep -q denied-by-policy-ok out.txt || { echo "::error::no policy denial observed"; exit 1; }
          grep -q LEAK out.txt && { echo "::error::egress leak"; exit 1; }
          echo "both halves held: allowlisted reachable, other refused by policy"

      - name: Live suite
        if: inputs.run_live_suite
        run: cargo test --workspace --locked -- --ignored --test-threads=1

      - name: Verdict
        if: always()
        run: |
          {
            echo "### Full boot probe"
            echo ""
            echo "Whether a hosted runner can run isopod's live suite."
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| networking provisioned | ${{ steps.setup.outcome }} |"
            echo "| job | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
