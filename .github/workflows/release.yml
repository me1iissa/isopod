name: Release

on:
  push:
    tags: ['v*']

permissions: {}

# A tag build is never cancelled by a later one; it queues.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build & publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create publishes the release and its assets
      id-token: write # OIDC identity attest-build-provenance presents to Sigstore
      attestations: write # stores the signed attestation against the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Host packaging deps
        run: sudo apt-get update && sudo apt-get install -y musl-tools rpm

      # Deliberately NOT cached. A restored `target/` is compiled object code,
      # and everything below packages whatever it finds there into the .deb,
      # the .rpm and the tarball. `--locked` pins dependency versions; it says
      # nothing about the contents of a cache entry. Actions caches are writable
      # from the default branch and readable by a tag build, so caching here
      # would let anything that can run a workflow on `main` place artifacts
      # into a signed-off release without touching a line of source — and
      # SHA256SUMS below would checksum the result without complaint.
      # A release is the one build that must start from nothing.

      - name: Build host binaries
        run: cargo build --release --workspace --locked

      - name: Build the static guest agent
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p isopod-guest-agent
          mkdir -p dist
          install -m755 target/x86_64-unknown-linux-musl/release/isopod-guest-agent dist/

      - name: Build vendored Firecracker
        run: |
          ./target/release/isopod dev build-fc
          mkdir -p dist
          install -m755 "$HOME/.isopod/bin/firecracker" dist/firecracker

      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Package .deb
        run: cargo deb -p isopod-cli --no-build -o dist/

      - name: Package .rpm
        run: cargo generate-rpm -p crates/cli -o dist/

      - name: Package tarball
        run: |
          ver="${GITHUB_REF_NAME#v}"
          stage="isopod-${ver}-x86_64-linux"
          mkdir -p "$stage/lib"
          install -m755 target/release/isopod target/release/isopod-mcp target/release/isopod-jail "$stage/"
          install -m755 dist/firecracker dist/isopod-guest-agent "$stage/lib/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          tar czf "dist/${stage}.tar.gz" "$stage"

      - name: Verify package contents
        run: |
          echo "== deb contents =="
          dpkg -c dist/*.deb
          for f in usr/bin/isopod usr/bin/isopod-mcp usr/bin/isopod-jail \
                   usr/lib/isopod/firecracker usr/lib/isopod/isopod-guest-agent; do
            dpkg -c dist/*.deb | grep -q "$f" || { echo "::error::$f missing from .deb"; exit 1; }
          done
          echo "== rpm contents =="
          rpm -qlp dist/*.rpm
          for f in /usr/bin/isopod /usr/bin/isopod-mcp /usr/bin/isopod-jail \
                   /usr/lib/isopod/firecracker /usr/lib/isopod/isopod-guest-agent; do
            rpm -qlp dist/*.rpm | grep -qx "$f" || { echo "::error::$f missing from .rpm"; exit 1; }
          done

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      # SHA256SUMS above proves a download matches what the workflow uploaded;
      # it proves nothing about where the build came from — an attacker with
      # `contents: write` regenerates the checksums along with the binaries.
      # The attestation is signed with the runner's OIDC identity via Sigstore
      # and recorded in a public transparency log, tying every shipped asset
      # to this repository, this workflow file, this commit, this trigger
      # (SLSA v1.0 Build L2). Verify with:
      #   gh attestation verify <asset> -R me1iissa/isopod
      # What it does NOT buy: it attests that this workflow built the
      # artifact; it does not audit the workflow. A compromised pinned action
      # would produce a perfectly attested compromised binary — the workflow
      # lint and the no-cache rule above are what defend the build itself.
      # A failed attestation blocks the release: no external inputs beyond
      # Sigstore availability, and a release is a manual, retryable event.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/firecracker
            dist/isopod-guest-agent

      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '/^## \[/{p = index($0, "[" ver "]") > 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
