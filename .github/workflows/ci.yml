name: CI

on:
  push:
    # `preview` is the experimental line (see docs/preview-branch.md). It is
    # covered here deliberately: a preview branch nobody tests is a branch that
    # rots into a merge liability, which is the failure mode this project has
    # to avoid given how fast `main` moves.
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

# One run per ref; superseded PR runs are cancelled to conserve free minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Paths whose change constitutes a "code wave" and therefore demands a
  # version bump (CONTRIBUTING.md § Versioning). Docs/CI-only changes are
  # exempt.
  CODE_PATHS: crates/ Cargo.toml Cargo.lock vendor/ scripts/

jobs:
  version-guard:
    name: Version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract workspace version
        id: ver
        run: |
          ver="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$ver" ]; then
            echo "::error::could not read workspace version from Cargo.toml"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "workspace version: $ver"

      # The version below is grep-cut from the PR author's Cargo.toml, so it is
      # attacker-chosen bytes. It reaches the shell through `env`, never by
      # template expansion inside `run:` — expansion would let a hostile
      # version string inject shell into a job that holds the workflow token.
      - name: Plugin manifest is in lockstep
        env:
          HEAD_VER: ${{ steps.ver.outputs.version }}
        run: |
          plugin="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$plugin" != "$HEAD_VER" ]; then
            echo "::error file=.claude-plugin/plugin.json::plugin version ($plugin) != workspace version ($HEAD_VER) — bump them together"
            exit 1
          fi

      - name: Incoming version must be newer than the current one (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_VER: ${{ steps.ver.outputs.version }}
        run: |
          base_sha="$BASE_SHA"
          base_ver="$(git show "$base_sha:Cargo.toml" | grep -m1 '^version = ' | cut -d'"' -f2)"
          head_ver="$HEAD_VER"
          echo "current (base): $base_ver -> incoming (head): $head_ver"
          if [ "$head_ver" = "$base_ver" ]; then
            # CODE_PATHS is a space-separated pathspec list and MUST word-split
            # here. Quoting it hands git one path literally named
            # "crates/ Cargo.toml Cargo.lock vendor/ scripts/", which matches
            # nothing, so the diff is always empty and the guard passes on
            # every change it exists to catch.
            # shellcheck disable=SC2086
            if git diff --name-only "$base_sha"...HEAD -- $CODE_PATHS | grep -q .; then
              echo "::error file=Cargo.toml::code changed but the workspace version is still $base_ver — bump it (semver: minor for features/breaking, patch for fixes)"
              exit 1
            fi
            echo "docs/CI-only change; equal version accepted"
          elif [ "$(printf '%s\n%s\n' "$base_ver" "$head_ver" | sort -V | tail -1)" != "$head_ver" ]; then
            echo "::error file=Cargo.toml::incoming version $head_ver is LOWER than current $base_ver"
            exit 1
          fi

      - name: Version must describe the tree (main)
        if: github.event_name == 'push'
        env:
          HEAD_VER: ${{ steps.ver.outputs.version }}
        run: |
          ver="$HEAD_VER"
          latest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)"
          if [ -n "$latest" ] && [ "$ver" != "$latest" ] && \
             [ "$(printf '%s\n%s\n' "$latest" "$ver" | sort -V | tail -1)" != "$ver" ]; then
            echo "::error file=Cargo.toml::workspace version $ver is lower than already-tagged v$latest"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            tagged="$(git rev-list -n1 "v$ver")"
            # A tag on the WRONG COMMIT is the failure this check exists to name
            # directly. `git tag -a vX.Y.Z` with no commit tags whatever HEAD
            # happens to be — which, when work spans git worktrees, is often a
            # different branch. That happened to v0.13.1: it landed on v0.13.0's
            # commit, so the release shipped .deb and .rpm packages declaring the
            # previous version, and this job then failed four times running with
            # "code changed but the version was not bumped" — true, useless, and
            # pointing at a bump that had already been made.
            tagged_ver="$(git show "$tagged:Cargo.toml" | grep -m1 '^version = ' | cut -d'"' -f2)"
            if [ "$tagged_ver" != "$ver" ]; then
              echo "::error file=Cargo.toml::tag v$ver points at $tagged, whose Cargo.toml declares $tagged_ver — the tag is on the wrong commit. Re-tag with an explicit sha: git tag -f -a v$ver <sha-of-the-bump>"
              exit 1
            fi
            # CODE_PATHS is a space-separated pathspec list and MUST word-split
            # here. Quoting it hands git one path literally named
            # "crates/ Cargo.toml Cargo.lock vendor/ scripts/", which matches
            # nothing, so the diff is always empty and the guard passes on
            # every change it exists to catch.
            # shellcheck disable=SC2086
            if [ "$tagged" != "$GITHUB_SHA" ] && \
               git diff --name-only "$tagged" "$GITHUB_SHA" -- $CODE_PATHS | grep -q .; then
              echo "::error file=Cargo.toml::code changed since v$ver but the workspace version was not bumped"
              exit 1
            fi
          else
            echo "::warning::tag v$ver does not exist yet — push it alongside the bump commit (git push origin main --follow-tags)"
          fi

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # GitHub-hosted runners have no /dev/kvm, so the `#[ignore]`d live tests
      # (real boots, the egress bypass ledger) cannot RUN here. Compiling them
      # is still worth doing: without it they rot silently against API changes
      # and only break when someone next runs the ledger by hand, long after the
      # change that broke them. `--no-run` builds every test target, ignored
      # ones included.
      - name: Compile the live (/dev/kvm) tests
        run: cargo test --workspace --locked --no-run

      # Broken intra-doc links shipped twice before this gate existed, because
      # `cargo doc` is the one toolchain command CI never ran. Documentation that
      # links to a private item, or to a path that does not resolve, is a claim
      # the reader cannot follow.
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      # The tests above prove the code passes them. This proves they would
      # notice if it stopped: a fixed set of deliberate breakages, each one a
      # defect this project actually shipped, that must make the suite fail.
      # Every review pass over 0.11.0 found a test that covered the branch that
      # already worked; this is the gate for that class.
      - name: Mutations
        run: python3 scripts/mutation-check.py

  # Dependency policy over the locked crate graph, against deny.toml at the
  # repo root: licenses, banned duplicates, and source provenance. These three
  # checks are deterministic — the same tree gives the same answer forever, so
  # they can gate PRs. The advisories check is NOT here: a new RustSec entry
  # flips it with no code change, so it runs on a daily cron instead
  # (advisories.yml). cargo-deny reads metadata, not code — a malicious crate
  # with a clean license and no advisory passes.
  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # Supply-chain lint over the workflow files themselves: zizmor catches
  # credential leaks, permission creep, cache poisoning, template injection,
  # and unpinned actions; actionlint catches expression type errors, broken
  # job wiring, and (via shellcheck) defects in the run: blocks — this CI is
  # bash-heavy and nothing else lints that bash. Both tools are version-pinned:
  # an unpinned linter is a gate that turns red on someone else's schedule.
  # Static analysis only — neither tool sees what a pinned action does at
  # runtime, and neither polices repo settings.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.28.0 --min-severity medium --min-confidence high .github/workflows/
      # actionlint's documented installer is `curl | bash`; this project does
      # not run that in CI. The release tarball is fetched and verified against
      # a checksum recorded here from the release's checksums file.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint_${VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -color

  # Everything a reviewer would otherwise have to open three job logs to learn,
  # written once into the run summary and mirrored into a single pull-request
  # comment that is rewritten in place rather than appended to.
  #
  # It is NOT in ci-ok's `needs`, deliberately. A digest is a report, and a
  # broken report must not be able to block a merge whose code is fine. If this
  # job goes red, the PR still merges and the digest is simply absent.
  #
  # Coverage runs here rather than only on main because a percentage nobody
  # sees until after the merge cannot inform the merge. It is skipped outright
  # when a pull request touches no code, which is most of them.
  digest:
    name: PR digest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Scoped to this job alone. Nothing else in this workflow may write to a
      # pull request, and this job builds nothing that ships.
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Facts about this pull request
        id: facts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_ver="$(git show "$BASE_SHA:Cargo.toml" | grep -m1 '^version = ' | cut -d'"' -f2)"
          head_ver="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "base_version=$base_ver" >> "$GITHUB_OUTPUT"
          echo "head_version=$head_ver" >> "$GITHUB_OUTPUT"
          # Same pathspec, and the same word-splitting requirement, as the
          # version guard above: quoting it matches nothing and every answer
          # becomes "no code changed".
          # shellcheck disable=SC2086
          if git diff --name-only "$BASE_SHA"...HEAD -- $CODE_PATHS | grep -q .; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi
          # The base lockfile has to come out of git: the working tree only ever
          # holds the head's.
          git show "$BASE_SHA:Cargo.lock" > /tmp/base.lock 2>/dev/null || true

      - name: Install pinned toolchain
        if: steps.facts.outputs.code_changed == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools

      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        if: steps.facts.outputs.code_changed == 'true'
        with:
          tool: cargo-llvm-cov

      # Same reasoning as coverage.yml: a poisoned cache here can only corrupt a
      # number that gates nothing, and nothing this job produces is shipped.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.facts.outputs.code_changed == 'true'

      # continue-on-error: coverage failing is a missing section in the digest,
      # not a failed pull request.
      - name: Coverage
        if: steps.facts.outputs.code_changed == 'true'
        continue-on-error: true
        run: cargo llvm-cov --workspace --locked --summary-only | tee /tmp/coverage.txt

      - name: Assemble
        env:
          BASE_VERSION: ${{ steps.facts.outputs.base_version }}
          HEAD_VERSION: ${{ steps.facts.outputs.head_version }}
          CODE_CHANGED: ${{ steps.facts.outputs.code_changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/ci-digest.py \
            --base-lock /tmp/base.lock \
            --head-lock Cargo.lock \
            --base-version "$BASE_VERSION" \
            --head-version "$HEAD_VERSION" \
            --coverage /tmp/coverage.txt \
            --code-changed "$CODE_CHANGED" \
            --run-url "$RUN_URL" > /tmp/digest.md
          cat /tmp/digest.md >> "$GITHUB_STEP_SUMMARY"

      # Only for pull requests from this repository. A fork's token is read-only
      # by design, so posting would fail; the run summary above still renders
      # for everyone, which is why the digest is written there first and
      # mirrored here second rather than the other way round.
      - name: Post or update the comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          jq -n --rawfile body /tmp/digest.md '{body: $body}' > /tmp/payload.json
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- isopod-ci-digest -->")) | .id] | first')"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input /tmp/payload.json --silent
            echo "updated comment $existing"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" --input /tmp/payload.json --silent
            echo "posted a new digest comment"
          fi

  # The single context the branch ruleset requires. Naming individual jobs in
  # the ruleset means editing repository settings every time a job is added,
  # and a RENAMED job leaves a phantom required check that blocks every merge
  # forever with no way to satisfy it. This job is the seam: adding a gate is a
  # one-line `needs:` edit, reviewed like any other change.
  #
  # `if: !cancelled()` is load-bearing. Without it this job is SKIPPED whenever
  # a dependency fails — and to GitHub a skipped required check is not a
  # failure, it is nothing, so a red build would sail through the ruleset.
  # For the same reason a skipped dependency is treated as failure below: no
  # job here is path-filtered, so a skip can only mean the wiring is wrong.
  ci-ok:
    name: CI ok
    if: ${{ !cancelled() }}
    needs: [version-guard, build-test, deny, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: All gating jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing="$(echo "$NEEDS_JSON" | jq -r 'to_entries[]
            | select(.value.result != "success") | "\(.key): \(.value.result)"')"
          if [ -n "$failing" ]; then
            echo "::error::gating jobs did not succeed:"
            echo "$failing"
            exit 1
          fi
          echo "all gating jobs succeeded"
