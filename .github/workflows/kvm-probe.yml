name: KVM probe

# Answers one question this repo has been assuming the answer to: does a
# GitHub-hosted runner give us /dev/kvm, and can we actually open it?
#
# The assumption in coverage.yml — that the #[ignore]d live tests cannot run on
# hosted runners — predates GitHub enabling hardware acceleration on larger
# Linux runners in Feb 2023 and on standard 2-vCPU runners in April 2024. Their
# docs still call nested virtualisation unsupported and say /dev/kvm is
# inconsistently present on free runners, so the only way to know is to look.
#
# Deliberately workflow_dispatch only: it never runs on a push, costs nothing
# until asked, and is one commit to delete once it has told us what we need.
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Is /dev/kvm here, and usable
    runs-on: ubuntu-latest
    steps:
      - name: Runner shape
        run: |
          echo "vCPU:   $(nproc)"
          echo "memory: $(free -g | awk '/Mem:/{print $2}') GiB"
          echo "kernel: $(uname -r)"
          echo "user:   $(id -un), groups: $(id -nG)"

      # Presence and access are different failures and are reported separately.
      # The documented trap is /dev/kvm existing while the runner user is not in
      # the kvm group — which is why projects ship a udev rule to fix it. A
      # probe that only stats the node would report success, and the live suite
      # would then fail on EACCES with a far less obvious message.
      - name: Device node
        id: node
        run: |
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::/dev/kvm is absent on this runner"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Can this user open it
        if: steps.node.outputs.present == 'true'
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "::notice::/dev/kvm is readable and writable by $(id -un)"
          else
            echo "::warning::/dev/kvm exists but is not accessible to $(id -un) — a udev rule adding the runner to the kvm group would be needed"
          fi

      # kvm-ok reports whether the CPU advertises virtualisation and whether the
      # modules are loaded — a stronger signal than the device node alone.
      - name: kvm-ok
        if: steps.node.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpu-checker
          kvm-ok || echo "::warning::kvm-ok reported the CPU or modules are not usable"

      # The device is root:kvm 0660 and the runner user is not in the kvm
      # group, so every check above can pass while open() returns EACCES. This
      # is the udev rule the Android-emulator workflows ship for exactly this,
      # and it is the whole difference between "KVM is present" and "KVM is
      # usable". Applied here so the probe below measures the reachable state
      # rather than the default one.
      - name: Grant the runner access
        if: steps.node.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # The question that actually matters: can something open the device and
      # create a VM file descriptor. Everything above can pass while this fails.
      - name: Open it and create a VM
        if: steps.node.outputs.present == 'true'
        run: |
          cat > probe.c <<'C'
          #include <fcntl.h>
          #include <stdio.h>
          #include <sys/ioctl.h>
          #include <unistd.h>
          #include <linux/kvm.h>
          int main(void) {
            int fd = open("/dev/kvm", O_RDWR | O_CLOEXEC);
            if (fd < 0) { perror("open /dev/kvm"); return 1; }
            int api = ioctl(fd, KVM_GET_API_VERSION, 0);
            if (api < 0) { perror("KVM_GET_API_VERSION"); return 1; }
            printf("KVM_GET_API_VERSION = %d\n", api);
            int vm = ioctl(fd, KVM_CREATE_VM, 0);
            if (vm < 0) { perror("KVM_CREATE_VM"); return 1; }
            printf("KVM_CREATE_VM succeeded, fd = %d\n", vm);
            close(vm); close(fd);
            return 0;
          }
          C
          cc -O1 -o probe probe.c
          ./probe && echo "::notice::a VM file descriptor was created — the live suite can run here"
