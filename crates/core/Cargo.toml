[package]
name = "isopod-core"
description = "isopod orchestrator library: VM lifecycle, stages, snapshots, netns slots, image pipeline, on-disk store."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Stage store (M3): content-addressed layer ids via streamed BLAKE3 hashing.
blake3 = { workspace = true }
# VM lifecycle (M1 dev boot): the typed FC client + an async runtime to drive it.
isopod-fc = { workspace = true }
tokio = { workspace = true }
# Host<->guest RPC contract (M2 agent): async frame helpers behind the tokio feature.
isopod-proto = { workspace = true, features = ["tokio"] }
# The OCI extractor and layout reader. The import path adapts and packs what
# that crate produces; it deliberately knows nothing about isopod, so the
# adaptation (agent as PID 1, overlay mountpoints, the sidecar) lives here.
isopod-oci-unpack = { path = "../oci-unpack" }
# Layer blobs arrive gzipped in practice; the layout reader hands back the
# verified compressed bytes and the decoder is the caller's choice.
flate2 = { workspace = true }
# The network half of an import. Kept out of `oci-unpack` on purpose: the
# extractor is reviewable without any notion of where bytes came from.
isopod-oci-registry = { path = "../oci-registry" }
# Blocking HTTP: the image pipeline is a synchronous one-shot CLI path, so we
# opt the workspace reqwest into its `blocking` client (keeps the CLI runtime-free).
reqwest = { workspace = true, features = ["blocking", "query"] }
# Crate-local (not in the workspace set): S3 ListObjectsV2 XML parsing + home dir.
quick-xml = { version = "0.39", features = ["serialize"] }
dirs = "6"
# `flock` for the network-slot claim, and `kill` for the orphan reaper. Matches
# the raw-libc style of the sibling crates (no `nix`); already in the lockfile
# via isopod-fc, so this adds no crate and no compile time.
libc = "0.2"
# The WHATWG URL host parser, so a pinned credential host can be classified by
# the *same* parser that will dial it. `reqwest` re-exports only `Url`, not
# `Host`, and the broker's guard has to match on the variant. This resolves to
# the one `reqwest` already depends on (semver-unified, and pinned in the
# lockfile), which is the whole point — a second parser is what the guard got
# wrong. `net::broker` asserts the identity at compile time.
url = "2"

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` enables paused-clock tests (`start_paused`) for the vsock
# timeout coverage without real 10 s waits.
tokio = { workspace = true, features = ["test-util"] }
